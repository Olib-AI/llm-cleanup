# =============================================================================
# llm-cleanup — Continuous Integration
# =============================================================================
# Format, lint, test, and build the CLI + GUI on Linux, macOS, and Windows.
# The toolchain pin (Rust 1.99.1) lives in rust-toolchain.toml; CI reads it from
# there so a local build and a CI build are the same compiler.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  fixtures:
    name: Reproducible PDF fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install fixture fonts and generator
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install -r scripts/fixture-requirements.txt
      - name: Verify committed PDFs and ground truth
        run: python scripts/generate_fixtures.py --verify

  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libxcb1-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libfontconfig1-dev

      - name: Install Rust toolchain (1.99.1)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Verify toolchain pin matches rust-toolchain.toml
        run: |
          pinned="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          actual="$(rustc --version | cut -d' ' -f2)"
          echo "pinned=$pinned actual=$actual"
          [ "$pinned" = "$actual" ]

      - name: Check formatting
        run: |
          set -o pipefail
          cargo fmt --all --check 2>&1 | tee -a "$RUNNER_TEMP/ci-lint.log"

      - name: Clippy (deny warnings)
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee -a "$RUNNER_TEMP/ci-lint.log"

      - name: Run tests
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee -a "$RUNNER_TEMP/ci-lint.log"

      - name: Check the workspace builds without default features
        run: |
          set -o pipefail
          cargo check --workspace --locked --no-default-features 2>&1 | tee -a "$RUNNER_TEMP/ci-lint.log"

      - name: Publish API-accessible lint & test report
        if: always() && hashFiles('.github/scripts/publish_check_report.py') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          CONCLUSION="failure"
          [ "$JOB_STATUS" = "success" ] && CONCLUSION="success"
          python3 .github/scripts/publish_check_report.py \
            --name "CI Report (lint-and-test)" \
            --title "Lint & test: $CONCLUSION" \
            --conclusion "$CONCLUSION" \
            --head-sha "$HEAD_SHA" \
            --summary "Captured fmt, clippy, test, and no-default-features check logs." \
            --log-file "$RUNNER_TEMP/ci-lint.log"

  build:
    name: Build (${{ matrix.os }})
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libxcb1-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libfontconfig1-dev

      - name: Install Rust toolchain (1.99.1)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      - uses: Swatinem/rust-cache@v2

      - name: Build workspace (CLI + GUI)
        shell: bash
        run: cargo build --workspace --release --locked 2>&1 | tee "$RUNNER_TEMP/ci-build.log"

      - name: Publish API-accessible build report
        if: always() && hashFiles('.github/scripts/publish_check_report.py') != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          MATRIX_OS: ${{ matrix.os }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          CONCLUSION="failure"
          [ "$JOB_STATUS" = "success" ] && CONCLUSION="success"
          python3 .github/scripts/publish_check_report.py \
            --name "CI Report (build-$MATRIX_OS)" \
            --title "Build ($MATRIX_OS): $CONCLUSION" \
            --conclusion "$CONCLUSION" \
            --head-sha "$HEAD_SHA" \
            --summary "Release build log for \`$MATRIX_OS\`." \
            --log-file "$RUNNER_TEMP/ci-build.log"

  # ---------------------------------------------------------------------------
  # Windows runtime check: build the GUI, stage it exactly the way the release
  # workflow does (scripts/package-windows.ps1), and prove the Visual C++
  # runtime DLLs land next to the executable. This catches a rename or removal
  # of the redistributable layout in a Visual Studio runner image before a
  # release is cut, which is how "VCRUNTIME140.dll was not found" reaches users.
  # ---------------------------------------------------------------------------
  windows-runtime:
    name: Windows runtime packaging
    needs: lint-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (1.99.1)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      - uses: Swatinem/rust-cache@v2

      - name: Build GUI (release)
        run: cargo build --release --locked -p cleanup-gui

      - name: Stage app + Visual C++ runtime
        shell: pwsh
        run: ./scripts/package-windows.ps1 -StageDir stage -Verify

      - name: Assert the Visual C++ runtime sits next to the executable
        shell: pwsh
        run: |
          $required = @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll')
          foreach ($dll in $required) {
            $p = Join-Path 'stage' $dll
            if (-not (Test-Path $p)) { throw "missing $dll — a clean Windows install would fail to launch the app" }
          }
          Get-ChildItem stage\*.dll | Select-Object Name, Length | Format-Table

          # Informational: does the binary import the dynamic CRT at all? If a future
          # build switches to crt-static this stops matching and we can drop the bundle.
          $importsCrt = Select-String -Path stage\aiclean-gui.exe -Pattern 'VCRUNTIME140.dll','MSVCP140.dll' -SimpleMatch -Quiet
          Write-Host "binary imports the dynamic CRT: $importsCrt"

      - uses: actions/upload-artifact@v7
        with:
          name: aiclean-gui-windows-amd64-ci
          path: stage/
          retention-days: 7
