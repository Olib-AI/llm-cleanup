# =============================================================================
# llm-cleanup — Release
# =============================================================================
# On a version tag (e.g. `git tag v0.2.0 && git push --tags`), build the CLI for
# all platforms and the desktop app for macOS / Windows / Linux, sign + notarize
# the macOS artifacts, and publish a GitHub Release with SHA-256 checksums.
#
# Also supports `workflow_dispatch` to dry-run cross-platform CLI + GUI release
# builds without publishing a GitHub Release.
#
# Every job builds with the toolchain pinned in rust-toolchain.toml (Rust 1.99.1).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # CLI (`aiclean`) for every platform
  # ---------------------------------------------------------------------------
  cli:
    name: CLI ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, artifact: aiclean-linux-amd64, cross: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, artifact: aiclean-linux-arm64, cross: true }
          - { target: x86_64-apple-darwin, os: macos-latest, artifact: aiclean-darwin-amd64, cross: false }
          - { target: aarch64-apple-darwin, os: macos-latest, artifact: aiclean-darwin-arm64, cross: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, artifact: aiclean-windows-amd64.exe, cross: false }
    runs-on: ${{ matrix.os }}
    env:
      # The CLI is a single self-contained executable: statically linking the CRT means
      # `aiclean.exe` needs no Visual C++ runtime and no sidecar DLLs at all. Only the
      # GUI ships the app-local runtime (see scripts/package-windows.ps1).
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (1.99.1)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked -p cleanup-cli --target ${{ matrix.target }}

      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked -p cleanup-cli --target ${{ matrix.target }}

      - name: Sign & notarize (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_B64: ${{ secrets.APPLE_CERTIFICATE_B64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_B64" ]; then echo "No signing secrets; skipping."; exit 0; fi
          echo "$APPLE_CERTIFICATE_B64" | base64 --decode > /tmp/cert.p12
          KCHAIN="/tmp/build.keychain-db"; KPASS="$(openssl rand -hex 16)"
          security create-keychain -p "$KPASS" "$KCHAIN"
          security set-keychain-settings -lut 21600 "$KCHAIN"
          security unlock-keychain -p "$KPASS" "$KCHAIN"
          security import /tmp/cert.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KPASS" "$KCHAIN"
          security list-keychains -d user -s "$KCHAIN" login.keychain-db
          IDENTITY=$(security find-identity -v -p codesigning "$KCHAIN" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          BIN="target/${{ matrix.target }}/release/aiclean"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$BIN"
          ditto -c -k "$BIN" /tmp/aiclean-notarize.zip
          xcrun notarytool submit /tmp/aiclean-notarize.zip --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
          security delete-keychain "$KCHAIN"; rm -f /tmp/cert.p12 /tmp/aiclean-notarize.zip

      - name: Stage artifact
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/aiclean"
          [[ "${{ matrix.artifact }}" == *.exe ]] && src="${src}.exe"
          cp "$src" "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # ---------------------------------------------------------------------------
  # Desktop app (`aiclean-gui`)
  # ---------------------------------------------------------------------------
  gui:
    name: App ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, artifact: llm-cleanup-macos }
          - { os: windows-latest, artifact: aiclean-gui-windows-amd64 }
          - { os: ubuntu-latest, artifact: aiclean-gui-linux-amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libxcb1-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libfontconfig1-dev

      - name: Install Rust toolchain (1.99.1)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      - uses: Swatinem/rust-cache@v2

      - name: Build GUI
        run: cargo build --release --locked -p cleanup-gui

      - name: Package (macOS .app, signed + notarized)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_B64: ${{ secrets.APPLE_CERTIFICATE_B64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP="dist/llm-cleanup.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/aiclean-gui "$APP/Contents/MacOS/aiclean-gui"
          cp packaging/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          cp packaging/Info.plist "$APP/Contents/Info.plist"
          if [ -n "$APPLE_CERTIFICATE_B64" ]; then
            echo "$APPLE_CERTIFICATE_B64" | base64 --decode > /tmp/cert.p12
            KCHAIN="/tmp/build.keychain-db"; KPASS="$(openssl rand -hex 16)"
            security create-keychain -p "$KPASS" "$KCHAIN"
            security set-keychain-settings -lut 21600 "$KCHAIN"
            security unlock-keychain -p "$KPASS" "$KCHAIN"
            security import /tmp/cert.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KCHAIN"
            security set-key-partition-list -S apple-tool:,apple: -k "$KPASS" "$KCHAIN"
            security list-keychains -d user -s "$KCHAIN" login.keychain-db
            IDENTITY=$(security find-identity -v -p codesigning "$KCHAIN" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
            codesign --deep --force --options runtime --timestamp --sign "$IDENTITY" "$APP"
            ditto -c -k --keepParent "$APP" /tmp/app-notarize.zip
            xcrun notarytool submit /tmp/app-notarize.zip --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait || true
            xcrun stapler staple "$APP" || true
            security delete-keychain "$KCHAIN"; rm -f /tmp/cert.p12 /tmp/app-notarize.zip
          fi
          ditto -c -k --keepParent "$APP" "${{ matrix.artifact }}.zip"

      - name: Package (Windows, with the app-local Visual C++ runtime)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Stages aiclean-gui.exe, the MSVC runtime DLLs (vcruntime140, msvcp140, ...),
          # README/LICENSE and WINDOWS-RUNTIME.txt. -Verify makes a missing runtime a
          # build failure instead of a broken download.
          ./scripts/package-windows.ps1 -StageDir stage -TargetDir target/release -Verify

          # Belt and braces: assert the required DLLs are in the folder we are about to zip.
          foreach ($dll in @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll')) {
            if (-not (Test-Path (Join-Path 'stage' $dll))) { throw "stage is missing $dll" }
          }

          7z a "${{ matrix.artifact }}.zip" ./stage/*

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p stage
          cp target/release/aiclean-gui stage/
          cp README.md LICENSE stage/
          tar -czf "${{ matrix.artifact }}.tar.gz" -C stage .

      - name: Upload artifact (zip)
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

      - name: Upload artifact (tar)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  # ---------------------------------------------------------------------------
  # Publish the GitHub Release (tags only; skipped on workflow_dispatch dry-runs)
  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: [cli, gui]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true

      - name: Update Homebrew Tap (Cask & Formula)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          CASK_ZIP="artifacts/llm-cleanup-macos.zip"
          DARWIN_ARM64="artifacts/aiclean-darwin-arm64"
          DARWIN_AMD64="artifacts/aiclean-darwin-amd64"
          LINUX_ARM64="artifacts/aiclean-linux-arm64"
          LINUX_AMD64="artifacts/aiclean-linux-amd64"

          for f in "$CASK_ZIP" "$DARWIN_ARM64" "$DARWIN_AMD64" "$LINUX_ARM64" "$LINUX_AMD64"; do
            if [[ ! -f "$f" ]]; then
              echo "::error::Required artifact $f not found"
              exit 1
            fi
          done

          CASK_SHA="$(sha256sum "$CASK_ZIP" | awk '{print $1}')"
          DARWIN_ARM64_SHA="$(sha256sum "$DARWIN_ARM64" | awk '{print $1}')"
          DARWIN_AMD64_SHA="$(sha256sum "$DARWIN_AMD64" | awk '{print $1}')"
          LINUX_ARM64_SHA="$(sha256sum "$LINUX_ARM64" | awk '{print $1}')"
          LINUX_AMD64_SHA="$(sha256sum "$LINUX_AMD64" | awk '{print $1}')"

          echo "Updating Homebrew tap to version ${VERSION}..."

          TAP_DIR="$(mktemp -d)"
          SSH_KEY_FILE=""

          if [[ -n "${HOMEBREW_TAP_DEPLOY_KEY:-}" ]]; then
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            SSH_KEY_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/tap_key_XXXXXX")"
            echo "$HOMEBREW_TAP_DEPLOY_KEY" > "$SSH_KEY_FILE"
            chmod 600 "$SSH_KEY_FILE"
            ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null || true
            export GIT_SSH_COMMAND="ssh -i $SSH_KEY_FILE -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            git clone git@github.com:Olib-AI/homebrew-tap.git "$TAP_DIR"
          elif [[ -n "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/Olib-AI/homebrew-tap.git" "$TAP_DIR"
          else
            echo "::warning::Neither HOMEBREW_TAP_DEPLOY_KEY nor HOMEBREW_TAP_TOKEN is set; skipping Homebrew tap update."
            exit 0
          fi

          VERSION="$VERSION" \
          CASK_SHA="$CASK_SHA" \
          DARWIN_ARM64_SHA="$DARWIN_ARM64_SHA" \
          DARWIN_AMD64_SHA="$DARWIN_AMD64_SHA" \
          LINUX_ARM64_SHA="$LINUX_ARM64_SHA" \
          LINUX_AMD64_SHA="$LINUX_AMD64_SHA" \
          TAP_DIR="$TAP_DIR" \
          python3 -c "
          import os

          version = os.environ['VERSION']
          cask_sha = os.environ['CASK_SHA']
          darwin_arm64_sha = os.environ['DARWIN_ARM64_SHA']
          darwin_amd64_sha = os.environ['DARWIN_AMD64_SHA']
          linux_arm64_sha = os.environ['LINUX_ARM64_SHA']
          linux_amd64_sha = os.environ['LINUX_AMD64_SHA']
          tap_dir = os.environ['TAP_DIR']

          cask_path = os.path.join(tap_dir, 'Casks', 'llm-cleanup.rb')
          os.makedirs(os.path.dirname(cask_path), exist_ok=True)
          with open(cask_path, 'w', encoding='utf-8') as f:
              f.write(f'''cask \"llm-cleanup\" do
            version \"{version}\"
            sha256 \"{cask_sha}\"

            url \"https://github.com/Olib-AI/llm-cleanup/releases/download/v#{{version}}/llm-cleanup-macos.zip\"
            name \"llm-cleanup\"
            desc \"Remove AI-generated fingerprints from documents\"
            homepage \"https://www.olib.ai/\"

            livecheck do
              url :url
              strategy :github_latest
            end

            depends_on macos: :ventura

            app \"llm-cleanup.app\"
          end
          ''')

          formula_path = os.path.join(tap_dir, 'Formula', 'aiclean.rb')
          os.makedirs(os.path.dirname(formula_path), exist_ok=True)
          with open(formula_path, 'w', encoding='utf-8') as f:
              f.write(f'''class Aiclean < Formula
            desc \"Remove AI-generated fingerprints from documents\"
            homepage \"https://www.olib.ai/\"

            on_macos do
              if Hardware::CPU.arm?
                url \"https://github.com/Olib-AI/llm-cleanup/releases/download/v{version}/aiclean-darwin-arm64\"
                sha256 \"{darwin_arm64_sha}\"
              else
                url \"https://github.com/Olib-AI/llm-cleanup/releases/download/v{version}/aiclean-darwin-amd64\"
                sha256 \"{darwin_amd64_sha}\"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url \"https://github.com/Olib-AI/llm-cleanup/releases/download/v{version}/aiclean-linux-arm64\"
                sha256 \"{linux_arm64_sha}\"
              else
                url \"https://github.com/Olib-AI/llm-cleanup/releases/download/v{version}/aiclean-linux-amd64\"
                sha256 \"{linux_amd64_sha}\"
              end
            end

            def install
              bin.install Dir[\"aiclean-*\"].first => \"aiclean\"
            end

            test do
              assert_match \"aiclean\", shell_output(\"#{{bin}}/aiclean --version\")
            end
          end
          ''')
          "

          cd "$TAP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes in tap definitions; skipping commit."
          else
            git add Casks/llm-cleanup.rb Formula/aiclean.rb
            git commit -m "Update llm-cleanup cask and aiclean formula to ${VERSION}"
            git pull --rebase origin main || true
            git push origin main
            echo "Successfully updated and pushed Homebrew tap for llm-cleanup ${VERSION}"
          fi

          if [[ -n "$SSH_KEY_FILE" ]]; then
            rm -f "$SSH_KEY_FILE"
          fi
