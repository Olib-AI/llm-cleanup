[toolchain]
# Pin the whole repo to Rust 1.99.1 (released 2026-10-15, resolved via rustup).
# `cargo` in this directory automatically uses this toolchain; CI and release builds
# read the same pin. If it is missing, run `rustup toolchain install 1.99.1`.
channel = "1.99.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
