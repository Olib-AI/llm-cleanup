[package]
name = "cleanup-convert"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pure-Rust cross-format conversion (md / txt / docx / pdf) for llm-cleanup. Lossy by design; separate from the lossless clean path."

[dependencies]
cleanup-core = { workspace = true }
cleanup-formats = { workspace = true }
cleanup-rules = { workspace = true }
pulldown-cmark = { workspace = true }
thiserror = { workspace = true }
docx-rs = { workspace = true }
# OpenXML (DOCX) writing and reading, and PNG re-encoding for the PDF exporter.
flate2 = { workspace = true }
quick-xml = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
# The integration tests read tests/fixtures/manifest.json, the generator's ground truth.
serde_json = { workspace = true }

[lints]
workspace = true
