# cargo-audit configuration — https://github.com/rustsec/rustsec/tree/main/cargo-audit
#
# Picked up automatically by `cargo audit` when run from the repository root
# (cargo-audit reads `./.cargo/audit.toml`, falling back to `~/.cargo/audit.toml`).
#
# Policy
# ------
# * Vulnerabilities fail the build.
# * Unmaintained/unsound advisories are printed but do not fail (they are transitive,
#   upstream-owned, and tracked by Dependabot).
# * An entry may only be ignored when the affected code path is not reachable from
#   this workspace. Every ignore below records why, who owns it, and when to revisit.
#   Review this list at the start of every release (see SECURITY.md).

[advisories]
# Yanked crates in the lock file are always a mistake for us: fail on them.
ignore = [
    # --- zip: extraction-only advisories -------------------------------------
    # All three affect `ZipArchive::extract()` / `ZipStreamReader::extract()`:
    # SUID/SGID bit preservation and symlink-target escapes during *extraction*.
    # Our own direct dependency is upgraded to zip 9.1.0 (patched). One older
    # transitive copy (zip 8.6.0 via docx-rs 0.4.22, write path only) remains in
    # the lock file; llm-cleanup never extracts archives to the filesystem.
    # Owner: upstream docx-rs. Revisit when docx-rs adopts zip >= 9.0.1.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",

    # --- quick-xml: quadratic attribute parsing / namespace flooding ----------
    # Our own direct dependency is fixed (quick-xml 0.42.0, see Cargo.toml), and
    # docx-rs 0.4.22 moved to quick-xml 0.41.0. One older transitive copy remains
    # outside the code path that parses user documents:
    #   * 0.39.4 via wayland-scanner / zbus_xml — Linux desktop integration and
    #     build-time code generation, fed by trusted system files only.
    # The .docx reader that parses untrusted input is ours and runs on 0.42.0.
    # Owner: upstream wayland-rs / zbus. Revisit when wayland-scanner / zbus_xml bump quick-xml >= 0.41.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

# Show every informational advisory category so `cargo audit` output is complete.
informational_warnings = ["unmaintained", "unsound", "notice"]

[output]
format = "terminal"
quiet = false
# Fail the run on informational advisories that indicate unsoundness. Unmaintained
# crates are printed as warnings only: they are transitive and Dependabot-owned.
deny = ["unsound"]

[database]
# Advisory database used by CI and by `scripts/audit.sh`. `stale = false` turns an
# advisory DB that has not been refreshed in 90 days into a build failure, so a green
# audit never means "we checked an old database".
url = "https://github.com/RustSec/advisory-db"
fetch = true
stale = false
